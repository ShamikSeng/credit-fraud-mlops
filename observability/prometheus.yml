# Prometheus scrape config for the Fraud Detection API (Phase 3b).
#
# The FastAPI app exposes /metrics via prometheus_fastapi_instrumentator. On top of the
# baseline HTTP/infra metrics, Phase 3b adds custom input-drift gauges (fraud_input_drift_*)
# to that same endpoint, so a single scrape job covers both.
#
# Run via the Phase 3c docker-compose stack (this file is mounted into the prometheus
# service): `docker compose up`. The scrape target uses the compose network's service-name
# resolution — "app" is the fraud-detection-api container, reachable from the prometheus
# container as `app:8005` (not `localhost:8005`, which would mean the prometheus container
# itself).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager routing (Phase 4). Phase 3b defined alert rules but had no `alerting:`
# block, so every rule evaluated correctly and then fired into nothing. This is the line
# that turns a dashboard into a notification.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rules split by purpose so each file can be reviewed on its own:
#   recording_rules.yml - SLI numerators/denominators backing the burn-rate alerts
#   alert_rules.yml     - the alerts themselves
# Order matters at evaluation time only in the sense that recording rules must exist before
# alerts referencing them produce data; Prometheus evaluates groups independently, so the
# first evaluation cycle after a reload may briefly have no recorded series.
rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:
  - job_name: "fraud-detection-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8005"]
        labels:
          service: "fraud-detection"
