apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops
  labels:
    app: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops
  template:
    metadata:
      labels:
        app: mlops
    spec:
      containers:
        - name: mlops
          image: credit-fraud-mlops:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8005
          volumeMounts:
            - name: mlruns
              mountPath: /app/mlruns
      volumes:
        - name: mlruns
          hostPath:
            path: /run/desktop/mnt/host/c/Users/a_sen/Downloads/MLOps_Project/mlruns
            type: Directory